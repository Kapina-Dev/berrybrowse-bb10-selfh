<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BerryBrowse — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a; color: #fff;
      font-family: sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    #box {
      width: 300px; text-align: center;
      padding: 32px 24px; background: #111;
      border: 1px solid #2a2a2a; border-radius: 10px;
    }
    h1 { font-size: 20px; font-weight: bold; color: #cc0000; letter-spacing: 3px; margin-bottom: 4px; }
    p  { font-size: 11px; color: #444; margin-bottom: 24px; letter-spacing: 1px; }
    input[type=password] {
      width: 100%; padding: 11px 12px; font-size: 14px;
      background: #1a1a1a; color: #fff;
      border: 1px solid #333; border-radius: 5px;
      outline: none; margin-bottom: 12px;
    }
    input[type=password]:focus { border-color: #cc0000; }
    button {
      width: 100%; padding: 12px; font-size: 14px; font-weight: bold;
      background: #cc0000; color: #fff;
      border: none; border-radius: 5px; cursor: pointer;
    }
    button:active { opacity: 0.8; }
    #error { display: none; margin-top: 12px; font-size: 12px; color: #f44336; }
    #error.show { display: block; }
  </style>
</head>
<body>
  <div id="box">
    <h1>BERRYBROWSE</h1>
    <p>SELF-HOSTED</p>
    <form method="post" action="/login">
      <input type="password" name="password" placeholder="Password" autofocus>
      <button type="submit">CONNECT</button>
      <div id="error"></div>
    </form>
  </div>
  <script>
    if (location.search.indexOf('error=1') >= 0) {
      var el = document.getElementById('error');
      el.textContent = 'Wrong password.';
      el.className = 'show';
    }
  </script>
</body>
</html>
